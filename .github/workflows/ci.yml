name: Backend CI Security and Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check generated artifact drift
        run: |
          npm run build
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Generated artifacts are out of sync (drift detected)."
            git status
            exit 1
          fi

      - name: Run linter without modifying the checkout
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Run unit and integration tests
        run: npm run test:cov

      - name: Run migration tests
        run: |
          # Simulates a fresh db migration and rollback
          npx prisma migrate reset --force
          npx prisma migrate deploy

  security-scans:
    name: Security Scans
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Generate SBOM and run dependency audit
        run: npm run security:dependencies

      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-sbom-${{ github.sha }}
          path: artifacts/dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Dependency audit
        run: echo "Dependency audit is included in the SBOM gate above."

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t truthbounty-api:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'truthbounty-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sensitive-changes-check:
    name: Sensitive Changes Protection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for sensitive changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sensitive:
              - 'src/auth/**'
              - 'src/indexer/**'
              - 'prisma/**'
              - 'src/database/**'
              - '.github/workflows/**'

      - name: Prohibit automatic merge
        if: steps.filter.outputs.sensitive == 'true'
        run: |
          echo "Sensitive changes detected in auth, indexer, or database."
          echo "Automatic merge is prohibited. Ensure human review is completed."
          # Remove auto-merge label if present (pseudo-command for demonstration)
          # gh pr edit ${{ github.event.pull_request.number }} --remove-label "auto-merge"
