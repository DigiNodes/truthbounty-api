name: Backend CI Security and Quality Gates

# ── Fork workflow authorization ──────────────────────────────────────────────
# PRs from forks run this file on the safe `pull_request` event with a
# read-only GITHUB_TOKEN: no repository write access and no secrets are ever
# exposed to unreviewed head commits. Every gate below executes against the
# proposed head commit; the final `merge-gate` aggregates them into one status
# that branch protection may require. See docs/CI_APPROVAL.md for details.
#
# All first-party and third-party actions are pinned to immutable commit SHAs
# (never a moving `@main`/`@master` tag). No required job uses
# `continue-on-error: true`, and nothing under a required gate is skippable
# based on the branch that opened the PR.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --project tsconfig.build.json

      - name: Check generated artifact drift
        run: |
          npm run build
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Generated artifacts are out of sync (drift detected)."
            git status
            exit 1
          fi

      - name: Run linter without modifying the checkout
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Run unit and integration tests
        continue-on-error: false
        run: npm run test:cov

      - name: Run migration validation
        continue-on-error: false
        run: |
          # Simulates a fresh db migration and rollback from the committed
          # migrations alone; any drift between schema and migrations fails the
          # gate instead of deploying.
          npx prisma migrate reset --force
          npx prisma migrate deploy

  security-scans:
    name: Security Scans
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Dependency audit
        continue-on-error: false
        run: npm audit --audit-level=high

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@a5f3de55cc2065ae4dde8fee24076f137fd62fcf # v3.97.8
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          category: "/language:javascript-typescript"

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        continue-on-error: false
        run: docker build -t truthbounty-api:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: 'truthbounty-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sensitive-changes-check:
    name: Sensitive Changes Protection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for sensitive changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            sensitive:
              - 'src/auth/**'
              - 'src/indexer/**'
              - 'src/database/**'
              - 'src/v2/**'
              - 'prisma/**'
              - '.github/workflows/**'

      - name: Require reviewed-head approval for sensitive changes
        if: steps.filter.outputs.sensitive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # An APPROVED review is only valid when recorded on exactly this head
          # commit; any subsequent push invalidates it and demands fresh
          # approval (failed-closed gate, not a fast-forward trust).
          APPROVED="$(
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
              --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\")] | length"
          )"
          if [[ "$APPROVED" -lt 1 ]]; then
            echo "::error::Sensitive changes require an APPROVED review on the exact head SHA: $HEAD_SHA. A new push requires fresh approval."
            exit 1
          fi
          echo "Head SHA $HEAD_SHA has a fresh reviewer approval for sensitive paths."

  merge-gate:
    name: All Required Gates Passed
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - security-scans
      - container-scan
      - sensitive-changes-check
    if: always()
    steps:
      - name: Fail closing on any required gate failure
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9
        with:
          script: |
            const gates = ${{ toJSON(needs) }};
            const failed = Object.values(gates).filter((g) => g.result === 'failure');
            if (failed.length > 0) {
              throw new Error(
                `Required gates failed: ${failed.map((g) => `${g.result}:${g.outcome}`).join(', ')}`
              );
            }
