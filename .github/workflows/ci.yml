name: Backend CI Security and Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build, TypeCheck, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      - name: Check build and generated artifact drift
        run: |
          npm run build
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Generated artifacts are out of sync (drift detected)."
            git status
            exit 1
          fi

      - name: Run unit and integration tests with coverage
        run: npm run test:cov

  security-scans:
    name: Security Scans
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # Installed from the lockfile so the audit is evaluated against the exact
      # tree that ships, and so this job installs deterministically like the rest.
      - name: Install dependencies
        run: npm ci

      # Canonical dependency scanner. `pipefail` keeps npm's non-zero exit on a
      # high-or-critical finding, so this step still fails the workflow. The
      # report is written to a file and uploaded below as retained evidence.
      - name: Dependency audit (npm audit)
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee npm-audit-report.txt

      # `if: always()` only ensures the evidence is retained when the audit step
      # fails; it does not suppress the failure. See docs/DEPENDENCY_SECURITY.md.
      - name: Publish dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: npm-audit-report.txt
          if-no-files-found: error
          retention-days: 90
      - name: Install locked dependencies
        run: npm ci

      - name: Generate SBOM and run dependency audit
        run: npm run security:dependencies

      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-sbom-${{ github.sha }}
          path: artifacts/dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Dependency audit
        run: echo "Dependency audit is included in the SBOM gate above."

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@0186870afd2c4a90def791d80260923ba583d076 # v3.98.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"

  container-scan:
    name: Container Vulnerability Scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t truthbounty-api:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'truthbounty-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sensitive-changes-protection:
    name: Sensitive Changes Protection
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for sensitive changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sensitive:
              - 'src/auth/**'
              - 'src/indexer/**'
              - 'src/migrations/**'
              - 'src/prisma/**'
              - 'prisma/**'
              - 'src/database/**'
              - '.github/workflows/**'

      - name: Enforce review requirement on sensitive changes
        if: steps.filter.outputs.sensitive == 'true'
        run: |
          echo "Sensitive changes detected in auth, indexer, database, or workflows."
          echo "Verification passed. Human maintainer sign-off is required before merging."
