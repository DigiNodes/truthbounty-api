name: Backend CI Security and Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build, TypeCheck, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      - name: Check build and generated artifact drift
        run: |
          npm run build
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Generated artifacts are out of sync (drift detected)."
            git status
            exit 1
          fi

      - name: Run unit and integration tests with coverage
        run: npm run test:cov

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t truthbounty-api:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: 'truthbounty-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sensitive-changes-protection:
    name: Sensitive Changes Protection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for sensitive changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sensitive:
              - 'src/auth/**'
              - 'src/indexer/**'
              - 'prisma/**'
              - 'src/database/**'
              - '.github/workflows/**'

      - name: Enforce review requirement on sensitive changes
        if: steps.filter.outputs.sensitive == 'true'
        run: |
          echo "Sensitive changes detected in auth, indexer, database, or workflows."
          echo "Verification passed. Human maintainer sign-off is required before merging."
