config:
  target: "http://localhost:3000"
  phases:
    - duration: 30
      arrivalRate: 10
      rampTo: 50
      name: "Ramp up load"
    - duration: 60
      arrivalRate: 50
      name: "Sustain load"
  payload:
    # We can inject data, but for now we'll just generate random data in a function
    # or just send static JSON
  processor: "./artillery-processor.js"
scenarios:
  - name: "Read canonical claims"
    flow:
      - get:
          url: "/api/v2/claim-read-models?limit=20"
          expect:
            - statusCode: 200
